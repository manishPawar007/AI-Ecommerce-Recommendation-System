<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GadgetWorld AI</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="min-height: 100vh; background: radial-gradient(circle at center, #1e1b4b 0%, #080c14 100%);">

<div class="glass-card p-4 p-sm-5" style="width: 100%; max-width: 460px;">
    <!-- Logo & Brand Header -->
    <div class="text-center mb-4">
        <a href="Home.html" class="brand-logo justify-content-center mb-2">
            <i class="bi bi-cpu-fill"></i>
            <span>GadgetWorld <small class="text-primary fs-6">AI</small></span>
        </a>
        <h3 class="text-white mb-1 fw-bold">Create New Account</h3>
        <p class="text-muted small mb-0">Join GadgetWorld to track orders & save wishlist items</p>
    </div>

    <!-- Registration Form -->
    <form id="registerForm" onsubmit="handleCustomerRegisterSubmit(event)">
        <!-- Input 1: Full Name -->
        <div class="mb-3">
            <label for="regName" class="form-label text-white fw-semibold mb-1">
                <i class="bi bi-person-badge-fill text-primary me-1"></i> Full Name
            </label>
            <input type="text" id="regName" class="form-control py-2.5" placeholder="Enter your full name (e.g. Rahul Sharma)" required>
        </div>

        <!-- Input 2: Username / Email -->
        <div class="mb-3">
            <label for="regEmail" class="form-label text-white fw-semibold mb-1">
                <i class="bi bi-envelope-fill text-primary me-1"></i> Username / Email Address
            </label>
            <input type="email" id="regEmail" class="form-control py-2.5" placeholder="Enter your email address" required>
        </div>

        <!-- Input 3: Password -->
        <div class="mb-4">
            <label for="regPassword" class="form-label text-white fw-semibold mb-1">
                <i class="bi bi-lock-fill text-primary me-1"></i> Password
            </label>
            <div class="position-relative">
                <input type="password" id="regPassword" class="form-control py-2.5 pe-5" placeholder="Create a secure password" required>
                <button type="button" class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y text-decoration-none me-2" onclick="toggleRegPassword()">
                    <i id="reg-eye-icon" class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary-gradient w-100 py-3 fs-6 fw-bold mb-3">
            <i class="bi bi-person-plus-fill me-2"></i> Register Account
        </button>
    </form>

    <!-- Footer Option -->
    <div class="text-center border-top border-secondary border-opacity-10 pt-3">
        <p class="text-muted small mb-0">Already have an account? <a href="Login.html" class="text-primary fw-semibold">Sign In Here</a></p>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
function toggleRegPassword() {
    const input = document.getElementById('regPassword');
    const icon = document.getElementById('reg-eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

async function handleCustomerRegisterSubmit(e) {
    e.preventDefault();
    const name = document.getElementById("regName").value.trim();
    const email = document.getElementById("regEmail").value.trim().toLowerCase();
    const password = document.getElementById("regPassword").value.trim();

    showToast("Creating account...", "info");

    try {
        await postRequest("/auth/register", { name, email, password, role: "customer" });
    } catch (err) {
        console.warn("Register backend fallback");
    }

    localStorage.setItem("token", "customer-token-" + Date.now());
    localStorage.setItem("userName", name);
    localStorage.setItem("userEmail", email);
    localStorage.setItem("userRole", "customer");

    if (typeof mergeGuestStorageToUser === "function") {
        mergeGuestStorageToUser(email);
    }

    showToast(`Account Created! Welcome ${name}`, "success");
    setTimeout(() => window.location.href = "Home.html", 500);
}
</script>
</body>
</html>
