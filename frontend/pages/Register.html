<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GadgetWorld</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="main-header">
        <div class="container navbar">
            <a href="Home.html" class="brand-logo">
                <div class="brand-icon">⚡</div>
                <div>
                    <div class="brand-title">GadgetWorld</div>
                    <div class="brand-subtitle">AI Powered Shopping</div>
                </div>
            </a>
            <div class="nav-actions">
                <a href="Login.html" class="btn btn-secondary btn-sm">Already Registered? Sign In</a>
            </div>
        </div>
    </header>

    <!-- AUTH SECTION -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="font-size: 2.4rem; margin-bottom: 8px;">✨</div>
                <h2 style="font-size: 1.8rem; margin-bottom: 6px; color: #FFF;">Join GadgetWorld</h2>
                <p style="color: var(--text-muted); font-size: 0.88rem;">Create your account to unlock AI recommendations and express checkout.</p>
            </div>

            <form id="registerForm" onsubmit="event.preventDefault(); handleRegistration();">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="regName" class="form-input" required placeholder="e.g. Piyush Sharma">
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="regEmail" class="form-input" required placeholder="piyush@example.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="regPass" class="form-input" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="regConfirmPass" class="form-input" required placeholder="••••••••">
                </div>

                <button type="submit" id="regSubmitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    Create Account 🚀
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
                Already have an account? <a href="Login.html" style="color: var(--primary); font-weight: 600;">Sign In here →</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/core.js"></script>
    <script>
        async function handleRegistration() {
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPass").value;
            const confirmPass = document.getElementById("regConfirmPass").value;
            const btn = document.getElementById("regSubmitBtn");

            if (password !== confirmPass) {
                showToast("Password Mismatch", "Passwords do not match.", "error");
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<span class="spinner"></span> Creating Account...`;
            }

            try {
                const res = await apiRequest("/auth/register", "POST", {
                    name,
                    email,
                    password
                }, false);

                showToast("Registration Successful! 🎉", "Please sign in with your credentials.", "success");
                setTimeout(() => window.location.href = "Login.html", 900);
            } catch (e) {
                showToast("Registration Failed", e.message, "error");
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = "Create Account 🚀";
                }
            }
        }
    </script>
</body>
</html>
