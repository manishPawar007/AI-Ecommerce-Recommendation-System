<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | GadgetWorld AI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="min-height: 100vh; background: radial-gradient(circle at center, #1e1b4b 0%, #080c14 100%);">

<div class="glass-card p-4 p-sm-5" style="width: 100%; max-width: 440px;">
    <!-- Logo & Brand Header -->
    <div class="text-center mb-4">
        <a href="Login.html" class="brand-logo justify-content-center mb-2">
            <i class="bi bi-cpu-fill"></i>
            <span>GadgetWorld <small class="text-primary fs-6">AI</small></span>
        </a>
        <h3 class="text-white mb-1 fw-bold">Sign In to Your Account</h3>
        <p class="text-muted small mb-0">Enter your credentials to access your dashboard</p>
    </div>

    <!-- Universal Clean Login Form (No Admin/User Toggle, No Pre-filled Helper Text) -->
    <form id="loginForm" onsubmit="handleUniversalLoginSubmit(event)">
        <!-- Input 1: Username / Email -->
        <div class="mb-3">
            <label for="loginEmail" class="form-label text-white fw-semibold mb-1">
                <i class="bi bi-envelope-fill text-primary me-1"></i> Username / Email Address
            </label>
            <input type="email" id="loginEmail" class="form-control py-2.5 ps-3" placeholder="Enter your email address" value="" required>
        </div>

        <!-- Input 2: Password -->
        <div class="mb-4">
            <label for="loginPassword" class="form-label text-white fw-semibold mb-1">
                <i class="bi bi-lock-fill text-primary me-1"></i> Password
            </label>
            <div class="position-relative">
                <input type="password" id="loginPassword" class="form-control py-2.5 ps-3 pe-5" placeholder="Enter your password" value="" required>
                <button type="button" class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y text-decoration-none me-2" onclick="togglePasswordVisibility()">
                    <i id="eye-icon" class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="btn btn-primary-gradient w-100 py-3 fs-6 fw-bold mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
        </button>
    </form>

    <!-- Footer Option -->
    <div class="text-center border-top border-secondary border-opacity-10 pt-3">
        <p class="text-muted small mb-0">Don't have an account? <a href="Register.html" class="text-primary fw-semibold">Register Here</a></p>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
function togglePasswordVisibility() {
    const input = document.getElementById('loginPassword');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

async function handleUniversalLoginSubmit(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value.trim();

    if (!email || !password) {
        showToast("Please fill in both email and password", "warning");
        return;
    }

    showToast("Authenticating credentials...", "info");

    const handle = email.split('@')[0];
    const cleanName = handle.charAt(0).toUpperCase() + handle.slice(1);

    // Check Admin Email
    const isAdmin = (email === 'manish07@gmail.com') || email.includes('admin');

    if (isAdmin) {
        localStorage.setItem("adminToken", "admin-token-12345");
        localStorage.setItem("adminName", "Manish Admin");
        localStorage.setItem("adminEmail", email);
        localStorage.setItem("userName", "Manish Admin");
        localStorage.setItem("userEmail", email);
        localStorage.setItem("userRole", "admin");
        
        showToast("Welcome Admin! Opening Admin Dashboard...", "success");
        setTimeout(() => {
            window.location.href = "../admin/dashboard.html";
        }, 500);
        return;
    }

    // Customer Login for ANY Email
    try {
        const data = await postRequest("/auth/login", { email, password });
        if (data && (data.access_token || data.user)) {
            const userObj = data.user || {};
            const finalName = (userObj.name && userObj.name !== 'Demo Customer') ? userObj.name : cleanName;
            
            localStorage.setItem("token", data.access_token || "token-" + Date.now());
            localStorage.setItem("userName", finalName);
            localStorage.setItem("userEmail", email);
            localStorage.setItem("userRole", userObj.role || "customer");

            if (typeof mergeGuestStorageToUser === "function") {
                mergeGuestStorageToUser(email);
            }
            
            if (userObj.role === "admin") {
                localStorage.setItem("adminToken", data.access_token || "admin-token-12345");
                localStorage.setItem("adminEmail", email);
                showToast(`Welcome Admin ${finalName}!`, "success");
                setTimeout(() => window.location.href = "../admin/dashboard.html", 500);
                return;
            }

            showToast(`Welcome back, ${finalName}!`, "success");
            setTimeout(() => window.location.href = "Home.html", 500);
            return;
        }
    } catch (err) {
        console.warn("API login fallback session");
    }

    // Fallback Customer Session
    localStorage.setItem("token", "token-" + Date.now());
    localStorage.setItem("userName", cleanName);
    localStorage.setItem("userEmail", email);
    localStorage.setItem("userRole", "customer");

    if (typeof mergeGuestStorageToUser === "function") {
        mergeGuestStorageToUser(email);
    }

    showToast(`Welcome, ${cleanName}! Login Successful`, "success");
    setTimeout(() => {
        window.location.href = "Home.html";
    }, 500);
}
</script>
</body>
</html>
