<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | GadgetWorld</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="main-header">
        <div class="container navbar">
            <a href="Home.html" class="brand-logo">
                <div class="brand-icon">⚡</div>
                <div>
                    <div class="brand-title">GadgetWorld</div>
                    <div class="brand-subtitle">AI Powered Shopping</div>
                </div>
            </a>

            <nav class="nav-links">
                <a href="Home.html" class="nav-item">Home</a>
                <a href="Products.html" class="nav-item">Explore Products</a>
                <a href="Orders.html" class="nav-item">My Orders</a>
                <a href="Analytics.html" class="nav-item">Insights</a>
            </nav>

            <div class="nav-actions">
                <a href="Wishlist.html" class="action-badge-btn" title="Wishlist" style="background: rgba(244, 63, 94, 0.2); border-color: var(--accent-rose);">
                    ❤️
                    <span class="action-counter wishlist-counter-badge" style="display:none;">0</span>
                </a>

                <a href="Cart.html" class="action-badge-btn" title="Shopping Cart">
                    🛒
                    <span class="action-counter cart-counter-badge" style="display:none;">0</span>
                </a>

                <div id="userNavSlot"></div>
            </div>
        </div>
    </header>

    <!-- HEADER BANNER -->
    <div style="background: linear-gradient(180deg, rgba(244, 63, 94, 0.1) 0%, rgba(11, 15, 25, 0) 100%); padding: 36px 0 20px; border-bottom: 1px solid var(--border-glass);">
        <div class="container">
            <h1 style="font-size: 2.2rem; margin-bottom: 6px;">Your Saved Wishlist ❤️</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Keep track of favorite gadgets and move them directly to your cart with one click.</p>
        </div>
    </div>

    <!-- MAIN WISHLIST CONTENT -->
    <div class="container" style="padding: 40px 0;">
        <div class="products-grid" id="wishlistGrid">
            <!-- Skeletons -->
            <div class="skeleton" style="height: 360px;"></div>
            <div class="skeleton" style="height: 360px;"></div>
            <div class="skeleton" style="height: 360px;"></div>
        </div>

        <!-- AI SIMILAR PICKS SECTION -->
        <div style="margin-top: 60px;">
            <div class="section-header">
                <div>
                    <div class="section-tag">
                        <span>🤖</span> AI Personalized Matches
                    </div>
                    <h2 class="section-title">Similar Items You Might Love</h2>
                </div>
            </div>
            <div class="products-grid" id="wishlistRecommendationsGrid">
                <!-- Dynamic -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/core.js?v=5.0"></script>
    <script src="../js/wishlist.js?v=5.0"></script>
</body>
</html>
