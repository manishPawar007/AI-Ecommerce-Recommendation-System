<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders & Tracking | GadgetWorld</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="main-header">
        <div class="container navbar">
            <a href="Home.html" class="brand-logo">
                <div class="brand-icon">⚡</div>
                <div>
                    <div class="brand-title">GadgetWorld</div>
                    <div class="brand-subtitle">AI Powered Shopping</div>
                </div>
            </a>

            <nav class="nav-links">
                <a href="Home.html" class="nav-item">Home</a>
                <a href="Products.html" class="nav-item">Explore Products</a>
                <a href="Orders.html" class="nav-item active">My Orders</a>
                <a href="Analytics.html" class="nav-item">Insights</a>
            </nav>

            <div class="nav-actions">
                <a href="Wishlist.html" class="action-badge-btn" title="Wishlist">
                    ❤️
                    <span class="action-counter wishlist-counter-badge" style="display:none;">0</span>
                </a>

                <a href="Cart.html" class="action-badge-btn" title="Shopping Cart">
                    🛒
                    <span class="action-counter cart-counter-badge" style="display:none;">0</span>
                </a>

                <div id="userNavSlot"></div>
            </div>
        </div>
    </header>

    <!-- HEADER BANNER -->
    <div style="background: linear-gradient(180deg, rgba(99, 102, 241, 0.1) 0%, rgba(11, 15, 25, 0) 100%); padding: 36px 0 20px; border-bottom: 1px solid var(--border-glass);">
        <div class="container">
            <h1 style="font-size: 2.2rem; margin-bottom: 6px;">My Order History 📦</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Track live shipments, view item breakdowns, and reorder past purchases.</p>
        </div>
    </div>

    <!-- MAIN ORDERS CONTENT -->
    <div class="container" style="padding: 40px 0; max-width: 1000px;">
        
        <!-- Filter Tabs -->
        <div style="display: flex; gap: 10px; margin-bottom: 24px;" id="orderFilterTabs">
            <button class="btn btn-primary btn-sm" onclick="filterOrdersUI('all', this)">All Orders</button>
            <button class="btn btn-secondary btn-sm" onclick="filterOrdersUI('Placed', this)">Placed</button>
            <button class="btn btn-secondary btn-sm" onclick="filterOrdersUI('Shipped', this)">Shipped</button>
            <button class="btn btn-secondary btn-sm" onclick="filterOrdersUI('Delivered', this)">Delivered</button>
        </div>

        <div id="ordersContainer">
            <!-- Skeletons -->
            <div class="skeleton" style="height: 220px; margin-bottom: 20px;"></div>
            <div class="skeleton" style="height: 220px;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/core.js?v=7.0"></script>
    <script src="../js/orders.js?v=7.0"></script>
</body>
</html>
