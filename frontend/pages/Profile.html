<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile & Settings | GadgetWorld</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="main-header">
        <div class="container navbar">
            <a href="Home.html" class="brand-logo">
                <div class="brand-icon">⚡</div>
                <div>
                    <div class="brand-title">GadgetWorld</div>
                    <div class="brand-subtitle">AI Powered Shopping</div>
                </div>
            </a>

            <nav class="nav-links">
                <a href="Home.html" class="nav-item">Home</a>
                <a href="Products.html" class="nav-item">Explore Products</a>
                <a href="Orders.html" class="nav-item">My Orders</a>
                <a href="Analytics.html" class="nav-item">Insights</a>
            </nav>

            <div class="nav-actions">
                <a href="Wishlist.html" class="action-badge-btn" title="Wishlist">
                    ❤️
                    <span class="action-counter wishlist-counter-badge" style="display:none;">0</span>
                </a>

                <a href="Cart.html" class="action-badge-btn" title="Shopping Cart">
                    🛒
                    <span class="action-counter cart-counter-badge" style="display:none;">0</span>
                </a>

                <div id="userNavSlot"></div>
            </div>
        </div>
    </header>

    <!-- MAIN PROFILE CONTENT -->
    <div class="container" style="padding: 40px 0; max-width: 960px;">
        
        <!-- PROFILE HERO CARD -->
        <div class="glass-panel" style="padding: 30px; margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px;">
            <div style="display: flex; align-items: center; gap: 20px;">
                <div style="width: 72px; height: 72px; border-radius: var(--radius-full); background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #FFF; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);">
                    👤
                </div>
                <div>
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                        <h2 style="font-size: 1.5rem; color: #FFF;" id="profileName">Customer</h2>
                        <span class="badge badge-ai" id="profileRole">Customer</span>
                    </div>
                    <div style="color: var(--text-muted); font-size: 0.9rem;" id="profileEmail">customer@gadgetworld.com</div>
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary btn-sm" onclick="showChangePasswordModal()">
                    🔒 Change Password
                </button>
                <button class="btn btn-danger btn-sm" onclick="logoutUser()">
                    Sign Out
                </button>
            </div>
        </div>

        <!-- KPI SUMMARY TILES -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="glass-panel" style="padding: 22px; text-align: center;">
                <div style="font-size: 1.8rem; font-weight: 800; color: #FFF; font-family: 'Outfit';" id="statOrdersCount">0</div>
                <div style="font-size: 0.84rem; color: var(--text-muted); margin-top: 4px;">Total Orders Placed</div>
            </div>
            <div class="glass-panel" style="padding: 22px; text-align: center;">
                <div style="font-size: 1.8rem; font-weight: 800; color: var(--primary); font-family: 'Outfit';" id="statTotalSpent">₹0</div>
                <div style="font-size: 0.84rem; color: var(--text-muted); margin-top: 4px;">Lifetime Spend</div>
            </div>
            <div class="glass-panel" style="padding: 22px; text-align: center;">
                <div style="font-size: 1.8rem; font-weight: 800; color: var(--accent-rose); font-family: 'Outfit';" id="statWishlistCount">0</div>
                <div style="font-size: 0.84rem; color: var(--text-muted); margin-top: 4px;">Wishlist Items</div>
            </div>
            <div class="glass-panel" style="padding: 22px; text-align: center;">
                <div style="font-size: 1.8rem; font-weight: 800; color: var(--accent-emerald); font-family: 'Outfit';" id="statCartCount">0</div>
                <div style="font-size: 0.84rem; color: var(--text-muted); margin-top: 4px;">Active in Cart</div>
            </div>
        </div>

        <!-- PROFILE DETAILS & EDIT FORM -->
        <div class="glass-panel" style="padding: 30px;">
            <h3 style="font-size: 1.25rem; margin-bottom: 20px; color: #FFF;">Personal Account Information</h3>
            <form id="editProfileForm" onsubmit="event.preventDefault(); saveProfileChanges();">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="inputName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address (Read Only)</label>
                        <input type="email" id="inputEmail" class="form-input" readonly style="opacity: 0.7; cursor: not-allowed;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="inputPhone" class="form-input" placeholder="+91 98765 43210">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Default Shipping City</label>
                        <input type="text" id="inputCity" class="form-input" placeholder="Mumbai, MH">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px;">
                    <button type="submit" class="btn btn-primary">
                        Save Changes ✔
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- CHANGE PASSWORD MODAL -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 440px;">
            <button class="modal-close" onclick="document.getElementById('passwordModal').classList.remove('active')">✕</button>
            <h3 style="font-size: 1.3rem; margin-bottom: 16px; color: #FFF;">Change Account Password</h3>
            <form onsubmit="event.preventDefault(); submitPasswordChange();">
                <div class="form-group">
                    <label class="form-label">Current Password</label>
                    <input type="password" id="oldPass" class="form-input" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" id="newPass" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    Update Password 🔒
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/core.js?v=7.0"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            let user = await ensureRealUserId();
            if (!user) {
                user = getUser();
            }
            if (!user) {
                window.location.href = "Login.html";
                return;
            }

            document.getElementById("profileName").textContent = user.name;
            document.getElementById("profileEmail").textContent = user.email;
            document.getElementById("profileRole").textContent = (user.role || 'customer').toUpperCase();
            document.getElementById("inputName").value = user.name;
            document.getElementById("inputEmail").value = user.email;

            // Fetch live user metrics strictly for this verified user ID
            try {
                const [orders, wishlist, cart] = await Promise.all([
                    apiRequest(`/orders/?user_id=${user.id}`),
                    apiRequest(`/wishlist/?user_id=${user.id}`),
                    apiRequest(`/cart/?user_id=${user.id}`)
                ]);

                const totalSpent = (orders || []).reduce((sum, o) => sum + (Number(o.total_amount) || 0), 0);
                document.getElementById("statOrdersCount").textContent = (orders || []).length;
                document.getElementById("statTotalSpent").textContent = formatPrice(totalSpent);
                document.getElementById("statWishlistCount").textContent = (wishlist.items || []).length;
                document.getElementById("statCartCount").textContent = (cart.items || []).length;
            } catch (e) {
                console.error("Profile stats load error:", e);
            }
        });

        function saveProfileChanges() {
            const newName = document.getElementById("inputName").value.trim();
            const user = getUser();
            if (user && newName) {
                user.name = newName;
                setUser(user);
                document.getElementById("profileName").textContent = newName;
                showToast("Profile Updated", "Your information has been saved.", "success");
            }
        }

        function showChangePasswordModal() {
            document.getElementById("passwordModal").classList.add("active");
        }

        async function submitPasswordChange() {
            const oldPass = document.getElementById("oldPass").value;
            const newPass = document.getElementById("newPass").value;
            const user = getUser();

            try {
                await apiRequest(`/auth/change-password?user_id=${user.id}&old_password=${encodeURIComponent(oldPass)}&new_password=${encodeURIComponent(newPass)}`, "PUT");
                showToast("Password Changed", "Security credentials updated.", "success");
                document.getElementById("passwordModal").classList.remove("active");
            } catch (e) {
                showToast("Error", e.message || "Failed to update password", "error");
            }
        }
    </script>
</body>
</html>
