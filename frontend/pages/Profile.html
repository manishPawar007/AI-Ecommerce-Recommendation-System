<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Info | GadgetWorld AI</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Dynamic Header Navbar -->
<div id="navbar-container"></div>

<div class="container py-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="mb-1 text-white fw-bold"><i class="bi bi-person-badge text-primary me-2"></i> User Account Profile</h2>
            <!-- High-Contrast Bright Subtitle -->
            <p class="small mb-0 fw-normal" style="color: #cbd5e1 !important; font-size: 0.95rem;">View & manage your personal information, address, and order stats</p>
        </div>
        <a href="Orders.html" class="btn btn-sm btn-secondary-glass">
            <i class="bi bi-box-seam me-1"></i> View My Orders
        </a>
    </div>

    <div class="row g-4">
        <!-- Left Profile Badge Column -->
        <div class="col-lg-4">
            <div class="glass-card text-center p-4">
                <div class="position-relative d-inline-block mb-3">
                    <div class="stat-icon mx-auto rounded-circle d-flex align-items-center justify-content-center text-white" style="width: 80px; height: 80px; font-size: 2.5rem; background: var(--primary-gradient);">
                        <i class="bi bi-person-fill"></i>
                    </div>
                </div>
                <h4 id="cust-profile-name" class="text-white fw-bold mb-1">User Name</h4>
                <p id="cust-profile-email" class="small mb-3" style="color: #cbd5e1 !important;">user@example.com</p>
                <span id="cust-profile-role" class="badge-custom badge-info px-3 py-1 text-uppercase">VERIFIED CUSTOMER</span>

                <hr class="border-secondary border-opacity-20 my-4">

                <!-- Account Quick Stats with High Contrast Labels -->
                <div class="row text-center">
                    <div class="col-6 border-end border-secondary border-opacity-20">
                        <span class="d-block text-uppercase fw-bold mb-1" style="color: #94a3b8 !important; font-size: 0.75rem; letter-spacing: 0.8px;">TOTAL ORDERS</span>
                        <h3 id="profile-order-count" class="text-white fw-bold mb-0">0</h3>
                    </div>
                    <div class="col-6">
                        <span class="d-block text-uppercase fw-bold mb-1" style="color: #94a3b8 !important; font-size: 0.75rem; letter-spacing: 0.8px;">ACCOUNT STATUS</span>
                        <h3 class="text-success fw-bold mb-0">Active</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Editable Profile Info Column -->
        <div class="col-lg-8">
            <div class="glass-card">
                <h4 class="mb-4 text-white fw-bold border-bottom border-secondary border-opacity-10 pb-3">Personal Information</h4>
                
                <form id="custProfileForm" onsubmit="saveCustomerProfile(event)">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-white fw-semibold mb-1">Full Display Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-primary"><i class="bi bi-person"></i></span>
                                <input type="text" id="custNameInput" class="form-control bg-dark text-white border-secondary" placeholder="Enter your full name" style="background-color: rgba(30, 41, 59, 0.9) !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.15) !important;" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-white fw-semibold mb-1">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-primary"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="custEmailInput" class="form-control bg-dark text-white border-secondary" placeholder="Enter email address" style="background-color: rgba(30, 41, 59, 0.9) !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.15) !important;" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-white fw-semibold mb-1">Default Shipping & Delivery Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-primary"><i class="bi bi-geo-alt"></i></span>
                            <input type="text" id="custAddressInput" class="form-control bg-dark text-white border-secondary" placeholder="Enter flat, building, city and pincode" style="background-color: rgba(30, 41, 59, 0.9) !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.15) !important;">
                        </div>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button type="submit" class="btn btn-primary-gradient px-4 py-2.5">
                            <i class="bi bi-check-circle-fill me-1"></i> Update Profile Info
                        </button>
                        <a href="Home.html" class="btn btn-secondary-glass px-4 py-2.5">Back to Storefront</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="store-footer">
    <div class="container text-center text-muted small">
        © 2026 GadgetWorld AI Platform. All rights reserved.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
async function loadProfileData() {
    const userEmail = (localStorage.getItem("userEmail") || localStorage.getItem("adminEmail") || "").toLowerCase().trim();
    
    let userName = localStorage.getItem("userName") || localStorage.getItem("adminName") || "";
    if (!userName || userName === "Demo Customer" || userName === "Account") {
        if (userEmail) {
            const handle = userEmail.split('@')[0];
            userName = handle.charAt(0).toUpperCase() + handle.slice(1);
        } else {
            userName = "Customer";
        }
    }

    const userRole = (localStorage.getItem("userRole") || "customer").toUpperCase();

    document.getElementById("cust-profile-name").textContent = userName;
    document.getElementById("cust-profile-email").textContent = userEmail || "customer@gadgetworld.com";
    document.getElementById("cust-profile-role").textContent = userRole === "ADMIN" ? "STORE ADMINISTRATOR" : "VERIFIED CUSTOMER";
    
    document.getElementById("custNameInput").value = userName;
    document.getElementById("custEmailInput").value = userEmail || "customer@gadgetworld.com";
    document.getElementById("custAddressInput").value = localStorage.getItem("userAddress") || "Flat 402, Hightech Towers, Mumbai 400001";

    // Load actual user order count from backend API or per-user local storage
    let orderCount = 0;
    if (userEmail) {
        try {
            const apiOrders = await getRequest(`/orders?email=${encodeURIComponent(userEmail)}`);
            if (apiOrders && Array.isArray(apiOrders)) {
                orderCount = apiOrders.length;
            }
        } catch (e) {}

        if (orderCount === 0) {
            const orderKey = `userOrders_${userEmail}`;
            const orders = JSON.parse(localStorage.getItem(orderKey) || "[]");
            orderCount = orders.length;
        }
    }

    document.getElementById("profile-order-count").textContent = orderCount;
}

function saveCustomerProfile(e) {
    e.preventDefault();
    const name = document.getElementById("custNameInput").value.trim();
    const email = document.getElementById("custEmailInput").value.trim().toLowerCase();
    const address = document.getElementById("custAddressInput").value.trim();

    localStorage.setItem("userName", name);
    localStorage.setItem("userEmail", email);
    localStorage.setItem("userAddress", address);

    showToast("Profile information updated successfully!", "success");
    loadProfileData();
    renderStoreNavbar();
}

document.addEventListener("DOMContentLoaded", loadProfileData);
</script>
</body>
</html>
