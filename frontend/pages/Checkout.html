<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | GadgetWorld AI</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Dynamic Header Navbar -->
<div id="navbar-container"></div>

<div class="container py-5">
    <h2 class="mb-4 text-white fw-bold"><i class="bi bi-shield-check text-primary me-2"></i> Checkout & Delivery</h2>

    <form id="checkoutForm" onsubmit="submitOrder(event)">
        <div class="row g-4">
            <!-- Shipping Info & Payment Methods -->
            <div class="col-lg-8">
                <!-- Shipping Address Card -->
                <div class="glass-card mb-4 p-4">
                    <h4 class="mb-4 text-white fw-bold border-bottom border-secondary border-opacity-10 pb-3">
                        <i class="bi bi-geo-alt text-primary me-2"></i> Shipping Address
                    </h4>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-white fw-semibold mb-1">Full Name</label>
                            <input type="text" id="custName" class="form-control" placeholder="Enter your full name" value="" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-white fw-semibold mb-1">Phone Number</label>
                            <input type="tel" id="custPhone" class="form-control" placeholder="Enter 10-digit mobile number" value="" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white fw-semibold mb-1">Delivery Address</label>
                        <input type="text" id="custAddress" class="form-control" placeholder="Enter flat/house no, building, street, landmark" value="" required>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-white fw-semibold mb-1">City</label>
                            <input type="text" id="custCity" class="form-control" placeholder="Enter your city name" value="" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-white fw-semibold mb-1">Pincode</label>
                            <input type="text" id="custPincode" class="form-control" placeholder="Enter 6-digit area pincode" value="" required>
                        </div>
                    </div>
                </div>

                <!-- Payment Method Card -->
                <div class="glass-card p-4">
                    <h4 class="mb-4 text-white fw-bold border-bottom border-secondary border-opacity-10 pb-3">
                        <i class="bi bi-credit-card text-primary me-2"></i> Select Payment Method
                    </h4>

                    <div class="d-flex flex-column gap-3 mb-2">
                        <label class="glass-card p-3 d-flex align-items-center justify-content-between cursor-pointer" style="background: rgba(30, 41, 59, 0.6);">
                            <div class="d-flex align-items-center gap-2">
                                <input class="form-check-input me-2" type="radio" name="paymentMethod" value="UPI" checked>
                                <span class="fw-bold text-white fs-6">UPI Instant Payment (Google Pay / PhonePe / Paytm)</span>
                            </div>
                            <i class="bi bi-qr-code-scan fs-4 text-primary"></i>
                        </label>

                        <label class="glass-card p-3 d-flex align-items-center justify-content-between cursor-pointer" style="background: rgba(30, 41, 59, 0.6);">
                            <div class="d-flex align-items-center gap-2">
                                <input class="form-check-input me-2" type="radio" name="paymentMethod" value="Card">
                                <span class="fw-bold text-white fs-6">Credit / Debit Card (Visa, MasterCard, RuPay)</span>
                            </div>
                            <i class="bi bi-credit-card-2-front fs-4 text-primary"></i>
                        </label>

                        <label class="glass-card p-3 d-flex align-items-center justify-content-between cursor-pointer" style="background: rgba(30, 41, 59, 0.6);">
                            <div class="d-flex align-items-center gap-2">
                                <input class="form-check-input me-2" type="radio" name="paymentMethod" value="COD">
                                <span class="fw-bold text-white fs-6">Cash on Delivery (COD)</span>
                            </div>
                            <i class="bi bi-cash-stack fs-4 text-success"></i>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Order Items Preview & Submit -->
            <div class="col-lg-4">
                <div class="glass-card p-4">
                    <h4 class="mb-3 text-white fw-bold border-bottom border-secondary border-opacity-10 pb-3">Order Items Preview</h4>

                    <div id="checkout-items-list" class="mb-3" style="max-height: 250px; overflow-y: auto;">
                        <div class="text-center py-3 text-muted">Loading items...</div>
                    </div>

                    <hr class="border-secondary border-opacity-20 my-3">

                    <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                        <span class="text-white">Total Payable</span>
                        <span id="checkout-total" class="text-success fs-4">₹0.00</span>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-3 fs-6 fw-bold">
                        <i class="bi bi-shield-lock-fill me-1"></i> Place Order Now
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>

<footer class="store-footer">
    <div class="container text-center text-muted small">
        © 2026 GadgetWorld AI Platform. All rights reserved.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/checkout.js"></script>
</body>
</html>
