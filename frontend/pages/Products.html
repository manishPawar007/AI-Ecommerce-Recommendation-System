<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Catalog | GadgetWorld</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- ===========================
            NAVBAR
    ============================ -->
    <header class="main-header">
        <div class="container navbar">
            <a href="Home.html" class="brand-logo">
                <div class="brand-icon">⚡</div>
                <div>
                    <div class="brand-title">GadgetWorld</div>
                    <div class="brand-subtitle">AI Powered Shopping</div>
                </div>
            </a>

            <nav class="nav-links">
                <a href="Home.html" class="nav-item">Home</a>
                <a href="Products.html" class="nav-item active">Explore Products</a>
                <a href="Orders.html" class="nav-item">My Orders</a>
                <a href="Analytics.html" class="nav-item">Insights</a>
            </nav>

            <div class="nav-actions">
                <a href="Wishlist.html" class="action-badge-btn" title="Wishlist">
                    ❤️
                    <span class="action-counter wishlist-counter-badge" style="display:none;">0</span>
                </a>

                <a href="Cart.html" class="action-badge-btn" title="Shopping Cart">
                    🛒
                    <span class="action-counter cart-counter-badge" style="display:none;">0</span>
                </a>

                <div id="userNavSlot">
                    <!-- Dynamic -->
                </div>
            </div>
        </div>
    </header>

    <!-- ===========================
            HEADER BANNER
    ============================ -->
    <div style="background: linear-gradient(180deg, rgba(99, 102, 241, 0.1) 0%, rgba(11, 15, 25, 0) 100%); padding: 40px 0 20px; border-bottom: 1px solid var(--border-glass);">
        <div class="container">
            <h1 style="font-size: 2.2rem; margin-bottom: 8px;">Explore All Products</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Browse 200+ intelligent tech items synced directly with our PostgreSQL database.</p>
        </div>
    </div>

    <!-- ===========================
            CATALOG LAYOUT
    ============================ -->
    <div class="container products-page-layout">
        
        <!-- SIDEBAR FILTERS -->
        <aside class="filter-sidebar">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <h3 style="font-size: 1.15rem; color: #FFF;">Filters</h3>
                <button class="btn btn-secondary btn-sm" onclick="resetFilters()">Reset All</button>
            </div>

            <!-- Search input -->
            <div class="filter-group">
                <div class="filter-title">Search Catalog</div>
                <input 
                    type="text" 
                    id="catalogSearchInput" 
                    class="form-input" 
                    placeholder="Search by keywords..."
                    style="font-size: 0.88rem; padding: 8px 12px;"
                    oninput="debounceSearch()"
                >
            </div>

            <!-- Categories -->
            <div class="filter-group">
                <div class="filter-title">Categories</div>
                <div id="categoryFilterList">
                    <label class="filter-option">
                        <input type="radio" name="catFilter" value="all" checked onchange="applyFilters()">
                        <span>All Categories</span>
                    </label>
                    <!-- Injected dynamically -->
                </div>
            </div>

            <!-- Price Range -->
            <div class="filter-group">
                <div class="filter-title">
                    <span>Max Price</span>
                    <span id="priceDisplay" style="color: var(--primary); font-weight: 700;">₹1,50,000</span>
                </div>
                <input 
                    type="range" 
                    id="priceRange" 
                    class="price-range-slider" 
                    min="1000" 
                    max="150000" 
                    step="2000" 
                    value="150000"
                    oninput="document.getElementById('priceDisplay').textContent = formatPrice(this.value); applyFilters();"
                >
            </div>

            <!-- Stock Availability -->
            <div class="filter-group">
                <div class="filter-title">Availability</div>
                <label class="filter-option">
                    <input type="checkbox" id="inStockFilter" onchange="applyFilters()">
                    <span>In Stock Only</span>
                </label>
            </div>
        </aside>

        <!-- MAIN PRODUCTS CONTENT -->
        <main>
            <!-- TOP BAR -->
            <div class="glass-panel" style="padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;">
                <div style="font-size: 0.92rem; color: var(--text-muted);">
                    Showing <span id="showingCount" style="color: #FFF; font-weight: 700;">0</span> of <span id="totalCount" style="color: #FFF; font-weight: 700;">0</span> products
                </div>

                <div style="display: flex; align-items: center; gap: 12px;">
                    <label style="font-size: 0.88rem; color: var(--text-muted);">Sort By:</label>
                    <select id="sortSelect" class="form-input" style="width: auto; padding: 6px 12px; font-size: 0.88rem;" onchange="applyFilters()">
                        <option value="featured">✨ Featured</option>
                        <option value="price_asc">💵 Price: Low to High</option>
                        <option value="price_desc">💎 Price: High to Low</option>
                        <option value="rating">⭐ Highest Rated</option>
                        <option value="newest">🆕 Newest Arrivals</option>
                    </select>
                </div>
            </div>

            <!-- PRODUCTS GRID -->
            <div class="products-grid" id="productsCatalogGrid">
                <!-- Skeletons -->
                <div class="skeleton" style="height: 360px;"></div>
                <div class="skeleton" style="height: 360px;"></div>
                <div class="skeleton" style="height: 360px;"></div>
                <div class="skeleton" style="height: 360px;"></div>
                <div class="skeleton" style="height: 360px;"></div>
                <div class="skeleton" style="height: 360px;"></div>
            </div>

            <!-- PAGINATION -->
            <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 40px;" id="paginationControls">
                <!-- Injected dynamically -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/core.js?v=5.0"></script>
    <script src="../js/products.js?v=5.0"></script>
</body>
</html>
