<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupons & Discounts | GadgetWorld AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="top-header">
            <div>
                <h3 class="mb-0 text-white">Coupons & Promo Codes</h3>
                <p class="text-muted small mb-0">Create and manage customer discount vouchers</p>
            </div>
            
            <div class="header-actions">
                <div id="backend-status" class="backend-status-badge">
                    <span class="status-dot"></span> API Active
                </div>
                
                <button class="btn-primary-gradient" onclick="openAddCouponModal()">
                    <i class="bi bi-plus-lg"></i> Create New Coupon
                </button>
            </div>
        </header>

        <div class="glass-card">
            <div class="custom-table-container">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Coupon Code</th>
                            <th>Discount</th>
                            <th>Min Order Amount</th>
                            <th>Usage Count</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="coupons-tbody">
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
                                <p>Loading coupons from backend...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div class="modal fade" id="couponModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create Coupon</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="couponForm" onsubmit="saveCoupon(event)">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Coupon Code</label>
                        <input type="text" id="cCode" class="form-control text-uppercase" placeholder="e.g. SUMMER20" required>
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">Discount Value (%)</label>
                            <input type="number" id="cValue" class="form-control" placeholder="20" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Min Order (₹)</label>
                            <input type="number" id="cMin" class="form-control" placeholder="1000" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Usage Limit</label>
                        <input type="number" id="cLimit" class="form-control" value="100" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary-glass" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-gradient">Create Coupon</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/coupons.js"></script>
</body>
</html>
