<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Settings | GadgetWorld AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="top-header">
            <div>
                <h3 class="mb-0 text-white">Store Settings & System Controls</h3>
                <p class="text-muted small mb-0">Configure store options, database backups and cache</p>
            </div>
            
            <div class="header-actions">
                <div id="backend-status" class="backend-status-badge">
                    <span class="status-dot"></span> API Active
                </div>
            </div>
        </header>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="glass-card mb-4">
                    <h4 class="mb-3">General Store Profile</h4>
                    <form id="settingsForm" onsubmit="saveSettings(event)">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Store Name</label>
                                <input type="text" id="storeName" class="form-control" value="GadgetWorld AI Store">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Support Email</label>
                                <input type="email" id="supportEmail" class="form-control" value="support@gadgetworld.com">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Currency Symbol</label>
                                <input type="text" id="currencySymbol" class="form-control" value="₹ (INR)">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tax Rate (%)</label>
                                <input type="number" id="taxRate" class="form-control" value="18">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-gradient">
                            <i class="bi bi-save"></i> Save Settings
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="glass-card mb-4">
                    <h4 class="mb-3">System Actions</h4>
                    <div class="d-grid gap-2">
                        <button class="btn btn-secondary-glass py-2" onclick="triggerBackup()">
                            <i class="bi bi-database-down text-primary"></i> Create DB Backup
                        </button>
                        <button class="btn btn-secondary-glass py-2" onclick="clearCache()">
                            <i class="bi bi-trash text-warning"></i> Clear System Cache
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
