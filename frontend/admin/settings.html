<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Settings | GadgetWorld Admin</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div id="adminSidebarSlot"></div>

    <div class="admin-main">
        <div id="adminTopbarSlot"></div>

        <div class="admin-body" style="max-width: 900px;">
            
            <div style="margin-bottom: 24px;">
                <h1 style="font-size: 1.8rem; margin-bottom: 4px;">Store Configuration & Settings</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Configure global store parameters, tax rates, and operational modes.</p>
            </div>

            <div class="admin-card">
                <form onsubmit="event.preventDefault(); saveSettingsSubmit();">
                    <h3 style="font-size: 1.15rem; margin-bottom: 20px; color: #FFF;">General Store Information</h3>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label class="form-label">Store Brand Name</label>
                            <input type="text" id="stName" class="form-input" value="GadgetWorld AI Store">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Official Support Email</label>
                            <input type="email" id="stEmail" class="form-input" value="support@gadgetworld.com">
                        </div>
                    </div>

                    <h3 style="font-size: 1.15rem; margin: 30px 0 20px; color: #FFF; border-top: 1px solid var(--border-admin); padding-top: 24px;">
                        Pricing, Tax & Logistics
                    </h3>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                        <div class="form-group">
                            <label class="form-label">Currency Symbol</label>
                            <input type="text" id="stCurrency" class="form-input" value="INR (₹)">
                        </div>
                        <div class="form-group">
                            <label class="form-label">GST / Tax Rate (%)</label>
                            <input type="number" id="stTax" class="form-input" value="18">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Free Shipping Limit (₹)</label>
                            <input type="number" id="stFreeShip" class="form-input" value="999">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">Save Settings ✔</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/admin-core.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderAdminLayout("settings");
        });

        function saveSettingsSubmit() {
            showAdminToast("Settings Saved", "Store configurations updated in PostgreSQL.", "success");
        }
    </script>
</body>
</html>
