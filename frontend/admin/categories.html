<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories Management | GadgetWorld AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="top-header">
            <div class="header-search">
                <i class="bi bi-search"></i>
                <input type="text" id="category-search" placeholder="Search categories..." oninput="filterCategories()">
            </div>
            
            <div class="header-actions">
                <div id="backend-status" class="backend-status-badge">
                    <span class="status-dot"></span> API Active
                </div>
                
                <button class="btn-primary-gradient" onclick="openAddCategoryModal()">
                    <i class="bi bi-plus-lg"></i> Add New Category
                </button>
            </div>
        </header>

        <!-- Category Grid Container -->
        <div id="categories-grid" class="row g-4 mb-4">
            <div class="col-12 text-center py-5 text-muted">
                <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
                <p>Loading categories from backend...</p>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="catModalTitle">Add Category</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="categoryForm" onsubmit="saveCategory(event)">
                <div class="modal-body">
                    <input type="hidden" id="catId">
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" id="catName" class="form-control" placeholder="e.g. Smartwatches" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="catDesc" class="form-control" rows="3" placeholder="Category summary..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary-glass" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-gradient">Save Category</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
