<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Management | GadgetWorld AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="top-header">
            <div class="header-search">
                <i class="bi bi-search"></i>
                <input type="text" id="product-search" placeholder="Search products by title or description..." oninput="filterProducts()">
            </div>
            
            <div class="header-actions">
                <div id="backend-status" class="backend-status-badge">
                    <span class="status-dot"></span> API Active
                </div>
                
                <button class="btn-primary-gradient" onclick="openAddProductModal()">
                    <i class="bi bi-plus-lg"></i> Add New Product
                </button>
            </div>
        </header>

        <!-- Filters Bar -->
        <div class="glass-card mb-4 p-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-3">
                <select id="category-filter" class="form-select form-select-sm" style="width: 200px;" onchange="filterProducts()">
                    <option value="">All Categories</option>
                </select>
                
                <select id="stock-filter" class="form-select form-select-sm" style="width: 180px;" onchange="filterProducts()">
                    <option value="">All Stock Status</option>
                    <option value="in_stock">In Stock (>10)</option>
                    <option value="low_stock">Low Stock (1-10)</option>
                    <option value="out_of_stock">Out of Stock (0)</option>
                </select>
            </div>
            
            <div class="text-muted small">
                Showing <strong id="product-count" class="text-white">0</strong> products
            </div>
        </div>

        <!-- Products Table -->
        <div class="glass-card">
            <div class="custom-table-container">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
                                <p class="mb-0">Loading product catalog from backend...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Add / Edit Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Product</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)">
                <div class="modal-body">
                    <input type="hidden" id="productId">
                    <div class="mb-3">
                        <label class="form-label">Product Name / Title</label>
                        <input type="text" id="pTitle" class="form-control" placeholder="e.g. Wireless Noise Cancelling Headphones" required>
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select id="pCategory" class="form-select" required></select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" step="0.01" id="pPrice" class="form-control" placeholder="999" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Stock Quantity</label>
                            <input type="number" id="pStock" class="form-control" placeholder="50" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Image URL</label>
                        <input type="url" id="pImage" class="form-control" placeholder="https://images.unsplash.com/...">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="pDesc" class="form-control" rows="3" placeholder="Enter detailed product specs and features..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary-glass" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-gradient">Save Product</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/products.js"></script>
</body>
</html>
