<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile | GadgetWorld AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="top-header">
            <div>
                <h3 class="mb-0 text-white">Administrator Account</h3>
                <p class="text-muted small mb-0">Manage security, credentials, and profile settings</p>
            </div>
            
            <div class="header-actions">
                <div id="backend-status" class="backend-status-badge">
                    <span class="status-dot"></span> API Active
                </div>
            </div>
        </header>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="glass-card text-center p-4">
                    <div class="rounded-circle border border-primary mb-3 mx-auto d-flex align-items-center justify-content-center" style="width: 90px; height: 90px; background: rgba(99, 102, 241, 0.15); color: #818cf8; font-size: 2.8rem;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <h4 id="profile-display-name">Manish Admin</h4>
                    <p id="profile-display-email" class="text-muted small">manish07@gmail.com</p>
                    <span class="badge-custom badge-danger">SYSTEM ADMINISTRATOR</span>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="glass-card mb-4">
                    <h4 class="mb-3">Update Credentials</h4>
                    <form id="profileForm" onsubmit="updateProfile(event)">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="profName" class="form-control" value="Manish Admin" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="profEmail" class="form-control" value="manish07@gmail.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password (leave blank to keep unchanged)</label>
                            <input type="password" id="profPass" class="form-control" placeholder="••••••••">
                        </div>

                        <button type="submit" class="btn btn-primary-gradient">
                            <i class="bi bi-check-circle"></i> Save Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
