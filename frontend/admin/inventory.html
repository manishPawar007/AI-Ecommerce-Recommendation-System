<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Control | GadgetWorld AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="top-header">
            <div class="header-search">
                <i class="bi bi-search"></i>
                <input type="text" id="inventory-search" placeholder="Search inventory items..." oninput="filterInventory()">
            </div>
            
            <div class="header-actions">
                <div id="backend-status" class="backend-status-badge">
                    <span class="status-dot"></span> API Active
                </div>
            </div>
        </header>

        <!-- Inventory Control Table -->
        <div class="glass-card">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h4 class="mb-0">Stock Levels & Inventory Control</h4>
                <select id="stock-level-filter" class="form-select form-select-sm w-auto" onchange="filterInventory()">
                    <option value="">All Inventory Levels</option>
                    <option value="low">Low Stock (<= 10 units)</option>
                    <option value="out">Out of Stock (0 units)</option>
                </select>
            </div>

            <div class="custom-table-container">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Current Stock</th>
                            <th>Status</th>
                            <th>Quick Update Stock</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-tbody">
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
                                <p>Loading stock counts...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/inventory.js"></script>
</body>
</html>
