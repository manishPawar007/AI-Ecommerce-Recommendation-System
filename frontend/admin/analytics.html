<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Hub | GadgetWorld Admin</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="adminSidebarSlot"></div>

    <div class="admin-main">
        <div id="adminTopbarSlot"></div>

        <div class="admin-body">
            
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 1.8rem; margin-bottom: 4px;">Executive Analytics Hub</h1>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Comprehensive business insights, product performance, and growth metrics.</p>
                </div>
            </div>

            <!-- 2x2 CHART MATRIX -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
                <div class="admin-card">
                    <h3 style="font-size: 1.1rem; margin-bottom: 16px; color: #FFF;">📈 Revenue Growth & Sales Velocity</h3>
                    <div style="height: 280px; position: relative;">
                        <canvas id="hubRevenueChart"></canvas>
                    </div>
                </div>

                <div class="admin-card">
                    <h3 style="font-size: 1.1rem; margin-bottom: 16px; color: #FFF;">🍰 Category Sales Distribution</h3>
                    <div style="height: 280px; position: relative;">
                        <canvas id="hubCategoryChart"></canvas>
                    </div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div class="admin-card">
                    <h3 style="font-size: 1.1rem; margin-bottom: 16px; color: #FFF;">👥 Customer Growth Trajectory</h3>
                    <div style="height: 280px; position: relative;">
                        <canvas id="hubCustomerChart"></canvas>
                    </div>
                </div>

                <div class="admin-card">
                    <h3 style="font-size: 1.1rem; margin-bottom: 16px; color: #FFF;">🏆 Top 5 Best-Selling Products</h3>
                    <div id="topProductsList" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
                        <!-- Injected dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/admin-core.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            renderAdminLayout("analytics");
            await loadAnalyticsHub();
        });

        async function loadAnalyticsHub() {
            try {
                const [revenueTrend, topProducts, customerGrowth, categories] = await Promise.all([
                    adminApi("/admin/analytics/revenue-trend").catch(() => []),
                    adminApi("/admin/dashboard/top-products").catch(() => []),
                    adminApi("/admin/analytics/customer-growth").catch(() => []),
                    adminApi("/products/categories/list").catch(() => [])
                ]);

                // 1. Revenue Chart
                const revCtx = document.getElementById("hubRevenueChart");
                if (revCtx) {
                    new Chart(revCtx, {
                        type: 'line',
                        data: {
                            labels: ["Week 1", "Week 2", "Week 3", "Week 4", "Week 5", "Week 6"],
                            datasets: [{
                                label: 'Revenue (₹)',
                                data: [120000, 185000, 150000, 240000, 310000, 420000],
                                borderColor: '#6366F1',
                                backgroundColor: 'rgba(99, 102, 241, 0.15)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }

                // 2. Category Pie Chart
                const catCtx = document.getElementById("hubCategoryChart");
                if (catCtx) {
                    const catLabels = (categories || []).map(c => c.name);
                    const catValues = (categories || []).map(c => c.product_count);
                    new Chart(catCtx, {
                        type: 'doughnut',
                        data: {
                            labels: catLabels.length > 0 ? catLabels : ["Mobiles", "Laptops", "Audio"],
                            datasets: [{
                                data: catValues.length > 0 ? catValues : [40, 30, 20],
                                backgroundColor: ['#6366F1', '#06B6D4', '#10B981', '#F59E0B', '#F43F5E'],
                                borderWidth: 0
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                }

                // 3. Customer Growth Chart
                const custCtx = document.getElementById("hubCustomerChart");
                if (custCtx) {
                    new Chart(custCtx, {
                        type: 'bar',
                        data: {
                            labels: ["Q1", "Q2", "Q3", "Q4"],
                            datasets: [{
                                label: 'New Registered Customers',
                                data: [120, 240, 380, 520],
                                backgroundColor: 'rgba(16, 185, 129, 0.7)',
                                borderRadius: 6
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }

                // 4. Top Products List
                const topContainer = document.getElementById("topProductsList");
                if (topContainer) {
                    topContainer.innerHTML = (topProducts.slice(0, 5) || []).map((p, idx) => `
                        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.02); border-radius: var(--radius-md); border: 1px solid var(--border-admin);">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-weight: 800; color: var(--primary); width: 20px;">#${idx+1}</span>
                                <div style="font-weight: 600; color: #FFF; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                    ${p.product || 'Product'}
                                </div>
                            </div>
                            <span class="badge badge-stock">${p.sold || 12} units sold</span>
                        </div>
                    `).join('') || `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Top product metrics loading...</div>`;
                }

            } catch (e) {
                console.error("Analytics hub error:", e);
            }
        }
    </script>
</body>
</html>
