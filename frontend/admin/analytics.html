<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Insights | GadgetWorld AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="admin-wrapper">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="top-header">
            <div>
                <h3 class="mb-0 text-white">Sales & Performance Analytics</h3>
                <p class="text-muted small mb-0">Live backend telemetry and revenue growth trends</p>
            </div>
            
            <div class="header-actions">
                <div id="backend-status" class="backend-status-badge">
                    <span class="status-dot"></span> API Active
                </div>
            </div>
        </header>

        <!-- Charts Grid -->
        <div class="row g-4 mb-4">
            <div class="col-lg-8">
                <div class="glass-card">
                    <h4 class="mb-3">Revenue & Order Trend</h4>
                    <div style="height: 320px;">
                        <canvas id="revenueTrendChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="glass-card">
                    <h4 class="mb-3">Category Revenue Breakdown</h4>
                    <div style="height: 320px;">
                        <canvas id="categoryDonutChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
